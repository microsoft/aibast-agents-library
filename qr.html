<style>

  .bar a { color: #9fb3d9; font-size: 14px; }
  .bar select { background: #16204a; color: #fff; border: 1px solid #2c3a6e; border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 14px; max-width: 100%; }
  .bar .spacer { flex: 1; }
  .bar button { background: #16204a; color: #fff; border: 1px solid #2c3a6e; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .slide { flex: 1; display: grid; grid-template-columns: 1fr auto; gap: 48px; align-items: center; padding: 24px clamp(16px, 6vw, 96px) 48px; }
  .kicker { color: #4fc3f7; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; }
  h1 { font-size: clamp(32px, 5vw, 64px); line-height: 1.1; margin: 0 0 12px; }
  .count { color: #a9b4d0; font-size: clamp(16px, 1.8vw, 22px); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; columns: 1; }
  ul.two { columns: 2; column-gap: 32px; }
  li { font-size: clamp(16px, 1.6vw, 22px); padding: 6px 0; break-inside: avoid; }
  li::before { content: "▸ "; color: #4fc3f7; }
  .code { text-align: center; }
  .code .qr { background: #fff; padding: 16px; border-radius: 12px; width: min(42vh, 40vw); height: min(42vh, 40vw); }
  .code .qr svg { width: 100%; height: 100%; display: block; }
  .code b { display: block; font-size: clamp(16px, 1.8vw, 22px); margin-top: 16px; }
  .code small { color: #a9b4d0; font-size: 14px; }

    .slide { grid-template-columns: 1fr; gap: 24px; }
    .code { order: -1; }
    .code .qr { width: min(70vw, 300px); height: min(70vw, 300px); }

<body>
<div class="bar">
  <a href="./">Back to the library</a>
  <span class="spacer"></span>
  <button type="button" id="prev" aria-label="Previous industry">Back</button>
  <select id="pick" aria-label="Choose an industry"></select>
  <button type="button" id="next" aria-label="Next industry">Next</button>
</div>
<main class="slide" id="slide" aria-live="polite">
  <div>
    <p class="kicker">AI Agents Library</p>
    <h1 id="title">Loading</h1>
    <p class="count" id="count"></p>
    <ul id="list"></ul>
  </div>
  <div class="code">
    <div class="qr" id="qr"></div>
    <b>Scan with your phone camera</b>
    <small id="cap">Opens these use cases directly</small>
  </div>
</main>
<p class="hint">Left and right arrow keys change the industry. Share a single industry with ?industry=its-name.</p>
<script>
const NAMES = {
  b2b_sales: "B2B Sales", b2c_sales: "B2C Sales", energy: "Energy",
  financial_services: "Financial Services", general: "Cross-Industry", healthcare: "Healthcare",
  human_resources: "Human Resources", manufacturing: "Manufacturing",
  professional_services: "Professional Services", retail_cpg: "Retail & CPG",
  slg_government: "SLG Government", software_digital_products: "Software & Digital Products",
  telecom_media_gaming: "Telecom, Media & Gaming"
};
const SITE = "https://microsoft.github.io/aibast-agents-library/";
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const $ = id => document.getElementById(id);
let slides = [], at = 0;

function qrSvg(text) {
  const q = qrcode(0, "M"); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}

function show(i) {
  at = (i + slides.length) % slides.length;
  const s = slides[at];
  $("title").textContent = s.title;
  $("count").textContent = s.count;
  $("list").className = s.items.length > 7 ? "two" : "";
  $("list").innerHTML = "";
  s.items.forEach(t => { const li = document.createElement("li"); li.textContent = t; $("list").appendChild(li); });
  $("qr").innerHTML = qrSvg(s.url);
  $("cap").textContent = s.cap;
  $("pick").value = String(at);
  const u = new URL(location.href);
  if (s.key) u.searchParams.set("industry", s.key); else u.searchParams.delete("industry");
  history.replaceState(null, "", u);
}

fetch("registry.json").then(r => r.json()).then(reg => {
  const by = {};
  (reg.agents || []).filter(a => a._catalog_kind === "solution" && NAMES[a.category])
    .forEach(a => (by[a.category] = by[a.category] || []).push((a.display_name || a.name).replace(/ Agent$/, "")));
  const total = Object.values(by).reduce((n, l) => n + l.length, 0);
  slides.push({ key: "", title: "Every industry, one library", count: `Scan to browse all ${total} use cases`,
    items: Object.keys(NAMES).filter(k => by[k]).map(k => NAMES[k]), url: SITE, cap: "Opens the whole library" });
  Object.keys(NAMES).filter(k => by[k]).forEach(k => {
    const s = slug(NAMES[k]);
    slides.push({ key: s, title: NAMES[k], count: `${by[k].length} ready-to-demo use cases`,
      items: by[k], url: `${SITE}?industry=${s}#library`, cap: "Opens these use cases directly" });
  });
  slides.forEach((s, i) => { const o = document.createElement("option"); o.value = String(i); o.textContent = s.key ? s.title : "All industries"; $("pick").appendChild(o); });
  const want = new URLSearchParams(location.search).get("industry");
  show(Math.max(0, slides.findIndex(s => s.key && s.key === want)));
}).catch(() => { $("title").textContent = "The library list did not load. Reload the page."; });

$("prev").onclick = () => show(at - 1);
$("next").onclick = () => show(at + 1);
$("pick").onchange = e => show(Number(e.target.value));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(at + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(at - 1); }
});
</script>
</body>
