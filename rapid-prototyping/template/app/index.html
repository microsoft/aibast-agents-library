<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%230f6cbd%22/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f5f5;--fg:#242424;--dim:#616161;--card:#fff;--line:#e0e0e0;--accent:#0f6cbd;--ok:#107c10}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f0f0f0;--dim:#adadad;--card:#1f1f1f;--line:#333;--accent:#479ef5;--ok:#54b054}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px}
h1{margin:0 0 8px} p{color:var(--dim)}
form{display:flex;gap:8px;margin:20px 0}
input{flex:1;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:inherit}
button{font:inherit;padding:8px 18px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--line)}
.pill.live{background:var(--ok);color:#fff}
</style>
</head>
<body><main>
<h1>Prototype</h1>
<p>Ask the <b>Idea</b> agent on your local Brainstem. Live when the Brainstem answers; a recorded answer otherwise.</p>
<form id="f"><input id="topic" value="cutting meeting time in a 20-person team" aria-label="Topic"><button>Ask</button></form>
<div id="out"></div>
</main>
<script>
// A real answer captured from a run of this template. Shown, and labelled, only when the Brainstem is unreachable.
const RECORDED = {topic: "cutting meeting time in a 20-person team", ideas: [{"title": "Replace status meetings with a shared async update doc", "why": "Each member posts their progress, blockers, and asks in a shared doc by a set time, so only items needing discussion get a live meeting."}, {"title": "Set a default 25- or 50-minute meeting length with a hard agenda rule", "why": "Shorter default slots and a required agenda with a stated decision goal cut padding and stop meetings from expanding to fill the calendar."}, {"title": "Hold a monthly meeting audit and cancel recurring meetings without an owner", "why": "Reviewing every recurring meeting against its purpose and attendee list removes standing meetings that no longer deliver value and trims attendance to the people who actually need to be there."}]};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function ask(topic) {
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_input: `Use the Idea agent with topic "${topic}". Then just say done.`})});
    const d = await r.json(), m = (d.agent_logs || "").match(/\[Idea\] (\{[\s\S]*\})/);
    const j = m && JSON.parse(m[1]); if (!j || !j.ok) throw new Error(j?.error || d.error || "no result");
    return {live: true, ideas: j.ideas};
  } catch (e) { return {live: false, ideas: RECORDED.ideas, why: e.message}; }
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault(); const out = document.getElementById("out"); out.innerHTML = '<p>Asking…</p>';
  const r = await ask(document.getElementById("topic").value);
  out.innerHTML = (r.live ? '<span class="pill live">🧠 Live from your Brainstem</span>' : `<span class="pill" title="${esc(r.why)}">Recorded answer</span>`) +
    r.ideas.map(i => `<div class="card"><b>${esc(i.title)}</b><div>${esc(i.why)}</div></div>`).join("");
};
</script>
</body></html>
