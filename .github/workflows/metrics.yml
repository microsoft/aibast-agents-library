name: Metrics Snapshot

on:
  schedule:
    - cron: '20 5 * * *'  # 5:20 AM UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_metrics.py'
      - 'metrics.html'
      - 'registry.json'
      - 'solutions/catalog.json'
      - '.github/workflows/metrics.yml'

permissions:
  contents: write
  issues: read

concurrency:
  group: metrics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect public metrics
        # GitHub's traffic endpoints (clones, views, popular paths) require a
        # token with repository administration read access. The Actions
        # GITHUB_TOKEN cannot be granted that — `administration` is not a valid
        # workflow permission — so it returns 403 for traffic and only the CDN,
        # release and catalog metrics refresh.
        #
        # To unlock live clone, view, and popular-path counts in CI, add a
        # fine-grained PAT scoped to this repository with
        # "Administration: read". Add "Issues: read" when workshop-feedback
        # issue metrics should be collected. Store it as METRICS_TOKEN:
        #     gh secret set METRICS_TOKEN
        #
        # Without it, build_metrics.py reuses the last successful traffic read
        # recorded in state/metrics_history.json, so figures never zero out —
        # they just stop advancing until an authorized run happens.
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build_metrics.py

      - name: Report traffic source
        run: |
          python - <<'PY'
          import json, sys
          snapshot = json.load(open('state/metrics.json'))
          t = snapshot['traffic']
          if t.get('live'):
              print('traffic read live from the GitHub API')
          else:
              print(f"traffic unavailable (no METRICS_TOKEN) - reusing last read from {t.get('as_of')}")
          workshops = snapshot.get('workshops', {})
          rows = workshops.get('rows', [])
          workshop_slugs = {row.get('slug') for row in rows}
          file_rows = snapshot.get('file_metrics', {}).get('rows', [])
          agent_rows = snapshot.get('agent_metrics', [])
          print(
              f"workshop metrics: {len(rows)} rows; "
              f"{workshops.get('totals', {}).get('usage_events')} observed events; "
              f"agent upvotes={snapshot.get('totals', {}).get('agent_upvotes')}"
          )
          print(f"file metrics: {len(file_rows)} tracked files; agent metrics: {len(agent_rows)} rows")
          if len(rows) != 51:
              print('expected exactly 51 catalog-advertised workshop rows', file=sys.stderr)
              raise SystemExit(1)
          if 'grid-outage-response' in workshop_slugs:
              print('Grid Outage must remain excluded from advertised workshop metrics', file=sys.stderr)
              raise SystemExit(1)
          if not file_rows or not any(row.get('kind') == 'skill' for row in file_rows):
              print('tracked-file metrics must include SKILL.md rows', file=sys.stderr)
              raise SystemExit(1)
          if len(agent_rows) != snapshot.get('totals', {}).get('agents'):
              print('agent_metrics rows must match the registry agent count', file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/metrics.json state/metrics_history.json
          if git diff --staged --quiet; then
            echo "No metrics change"
          else
            git commit -m "chore: metrics snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
