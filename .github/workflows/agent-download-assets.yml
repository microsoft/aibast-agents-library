name: Agent Download Assets

on:
  push:
    branches: [main, easy-mode-copilot-chat-pilot]
    paths:
      - 'agents/**/*.py'
      - 'build_registry.py'
      - 'registry.json'
      - '.github/workflows/agent-download-assets.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: agent-download-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Build immutable agent assets
        run: |
          cp registry.json "$RUNNER_TEMP/registry-before.json"
          python build_registry.py
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          registry_path = Path("registry.json")
          previous_path = Path(os.environ["RUNNER_TEMP"]) / "registry-before.json"
          registry = json.loads(registry_path.read_text())
          previous = json.loads(previous_path.read_text())
          comparable = lambda value: {
              key: item for key, item in value.items() if key != "generated_at"
          }
          if comparable(registry) == comparable(previous):
              registry = previous
              registry_path.write_bytes(previous_path.read_bytes())

          output = Path("dist/agent-downloads")
          output.mkdir(parents=True, exist_ok=True)
          for agent in registry["agents"]:
              source = Path(agent["_file"])
              payload = source.read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              assert digest == agent["_sha256"], agent["name"]
              filename = agent["_install_filename"]
              assert filename.endswith("_agent.py"), filename
              shutil.copyfile(source, output / filename)
          print(f"Prepared {len(registry['agents'])} immutable agent assets")
          PY
          git config user.name "RAPP Registry Bot"
          git config user.email "rapp-bot@users.noreply.github.com"
          git add registry.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-build registry.json [skip ci]"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=true
                break
              fi
              echo "Registry push attempt $attempt failed; retrying"
            done
            test "$pushed" = true
          fi

      - name: Publish missing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            tag="agent-downloads"
            title="AIBAST Agent Downloads"
          else
            tag="agent-downloads-staging"
            title="AIBAST Agent Downloads (staging)"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$(git rev-parse HEAD)" \
              --title "$title" \
              --notes "Immutable agent.py assets. GitHub records each asset download."
          fi
          gh release view "$tag" --json assets --jq '.assets[].name' \
            > "$RUNNER_TEMP/existing-assets.txt"
          uploaded=0
          for asset in dist/agent-downloads/*.py; do
            name="$(basename "$asset")"
            if grep -Fxq "$name" "$RUNNER_TEMP/existing-assets.txt"; then
              continue
            fi
            gh release upload "$tag" "$asset"
            uploaded=$((uploaded + 1))
          done
          echo "Uploaded $uploaded new immutable agent assets"

      - name: Refresh static metrics JSON
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "metrics.yml",
              ref: context.ref.replace("refs/heads/", "")
            });
