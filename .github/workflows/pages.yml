name: Deploy Academy Pages

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event.repository.fork == true &&
       github.ref == 'refs/heads/staging') ||
      (github.repository == 'microsoft/aibast-agents-library' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Pages inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nojekyll
            /*.html
            /*.json
            /*.sh
            /*.ps1
            /*.cmd
            /*.command
            /README.md
            /CONSTITUTION.md
            /CONTRIBUTING.md
            /LICENSE
            /SECURITY.md
            /skill.md
            /docs/
            /reports/
            /state/
            /academy/
            /skills/
            /solutions/
            !/solutions/**/*.zip
            !/solutions/**/*.gif
            /beta/index.html
            /beta/download-center.js
            /beta/show-mode.html
            /beta/install.sh
            /beta/install.cmd
            /beta/frontier.sh
            /beta/frontier.ps1
            /beta/README.md
            /beta/LICENSE
            /beta/THIRD-PARTY-NOTICES.md
            /beta/VERSION
            /beta/build/icon.svg
            /beta/ui/index.html
            /beta/ui/renderer.js
            /beta/ui/show-mode-tour.js
            /rapp_brainstem/README.md
            /rapp_brainstem/VERSION
            /scripts/build_pages_site.py
            /tests/test_pages_site.py
            /.github/workflows/pages.yml
            !/browser-audit/
            !/agents/
            !/tools/
            !/**/node_modules/
            !/**/__pycache__/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Build slim Pages artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/build_pages_site.py
          --root .
          --out _site
          --owner "${{ github.repository_owner }}"
          --repo "${{ github.event.repository.name }}"
          --ref "${{ github.sha }}"
          --ring-branch "${{ github.ref_name }}"
          --check-links

      - name: Run Pages artifact tests
        env:
          PAGES_SITE_DIR: ${{ github.workspace }}/_site
        run: python -m unittest -v tests/test_pages_site.py

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
