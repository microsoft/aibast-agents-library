name: workshop feedback triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  label:
    if: >-
      contains(github.event.issue.body, '<!-- aibast-workshop-feedback:v1 -->') ||
      contains(github.event.issue.body, '<!-- aibast-agent-upvote:v1 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Label structured community signal
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const isAgentUpvote = body.includes("<!-- aibast-agent-upvote:v1 -->");
            const definitions = {
              "workshop-feedback": {
                name: "workshop-feedback",
                color: "b11f4b",
                description: "Structured feedback submitted from an AIBAST workshop."
              },
              "needs-triage": {
                name: "needs-triage",
                color: "f59e0b",
                description: "Requires review and routing."
              },
              "agent-upvote": {
                name: "agent-upvote",
                color: "1f6feb",
                description: "Public community preference signal for an AIBAST library agent."
              }
            };
            const selectedNames = isAgentUpvote
              ? ["agent-upvote"]
              : ["workshop-feedback", "needs-triage"];
            const labels = selectedNames.map((name) => definitions[name]);

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
              }
            }

            const managedNames = new Set(Object.keys(definitions));
            const currentNames = (context.payload.issue.labels || []).map((label) =>
              typeof label === "string" ? label : label.name
            );
            for (const name of currentNames) {
              if (!managedNames.has(name) || selectedNames.includes(name)) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels.map((label) => label.name)
            });
