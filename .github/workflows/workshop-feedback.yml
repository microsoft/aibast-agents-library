name: workshop feedback triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  label:
    if: contains(github.event.issue.body, '<!-- aibast-workshop-feedback:v1 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Label structured workshop feedback
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              {
                name: "workshop-feedback",
                color: "b11f4b",
                description: "Structured feedback submitted from an AIBAST Beta workshop."
              },
              {
                name: "needs-triage",
                color: "f59e0b",
                description: "Requires review and routing."
              }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels.map((label) => label.name)
            });
