name: workshop feedback triage

on:
  issues:
    types: [opened, edited, closed, reopened]

permissions:
  actions: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile structured community signal labels
        id: process-signal
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const isWorkshopFeedback = body.includes("<!-- aibast-workshop-feedback:v1 -->");
            const isAgiProgress = body.includes("<!-- aibast-agi-progress:v1 -->");
            const definitions = {
              "workshop-feedback": {
                name: "workshop-feedback",
                color: "b11f4b",
                description: "Structured feedback submitted from an AIBAST workshop."
              },
              "needs-triage": {
                name: "needs-triage",
                color: "f59e0b",
                description: "Requires review and routing."
              },
              "agi-progress": {
                name: "agi-progress",
                color: "8250df",
                description: "Opt-in public workshop achievement progress sync."
              }
            };
            const managedNames = new Set(Object.keys(definitions));
            const currentNames = (context.payload.issue.labels || []).map((label) =>
              typeof label === "string" ? label : label.name
            );
            const hasCurrentMarker = isWorkshopFeedback || isAgiProgress;
            const hasManagedLabel = currentNames.some((name) => managedNames.has(name));
            if (!hasCurrentMarker && !hasManagedLabel) {
              return false;
            }

            const selectedNames = isAgiProgress
              ? ["agi-progress"]
              : isWorkshopFeedback
                  ? ["workshop-feedback", "needs-triage"]
                  : [];
            const labels = selectedNames.map((name) => definitions[name]);

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
              }
            }

            for (const name of currentNames) {
              if (!managedNames.has(name) || selectedNames.includes(name)) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels.map((label) => label.name)
              });
            }
            return true;

      - name: Dispatch metrics compilation on default branch
        if: steps.process-signal.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const defaultBranch = context.payload.repository.default_branch;
            if (!defaultBranch) {
              throw new Error("Repository default branch is unavailable.");
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "metrics.yml",
              ref: defaultBranch
            });
