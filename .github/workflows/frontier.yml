# Frontier end-to-end scenarios.
#
# The Frontier is the repository's exploratory surface and is kept out of the
# mainline preflight on purpose: this workflow may change as fast as `beta/`
# does without touching the gate that guards production `main`. Everything it
# runs lives under `beta/`; it never builds or publishes the library itself.

name: frontier

on:
  push:
    branches-ignore: [main]
    paths:
      - 'beta/**'
      - '.github/workflows/frontier.yml'
  pull_request:
    branches: [main]
    paths:
      - 'beta/**'
      - '.github/workflows/frontier.yml'
  workflow_dispatch:

concurrency:
  group: frontier-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontier-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: xvfb-run -a node --test tests/e2e
          - os: macos-latest
            command: node --test tests/e2e
          - os: windows-latest
            command: node --test --test-concurrency=1 tests/e2e
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'

      - name: Create isolated Brainstem environment
        shell: bash
        run: |
          VENV="$RUNNER_TEMP/frontier-e2e-venv"
          python -m venv "$VENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON="$VENV/Scripts/python.exe"
          else
            PYTHON="$VENV/bin/python"
          fi
          "$PYTHON" -m pip install -q -r rapp_brainstem/requirements.txt
          printf 'BRAINSTEM_BETA_PYTHON=%s\n' "$PYTHON" >> "$GITHUB_ENV"

      - name: Install Frontier test dependencies
        working-directory: beta
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: Run deterministic Frontier scenarios
        working-directory: beta
        shell: bash
        env:
          BRAINSTEM_BETA_E2E: '1'
          BRAINSTEM_BETA_E2E_REQUIRED: '1'
        run: ${{ matrix.command }}
