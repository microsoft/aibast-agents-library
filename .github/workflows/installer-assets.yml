name: Installer Assets

# Publishes the one-liner installers as assets on the rolling "installers"
# release so every install is a GitHub-recorded download (raw.githubusercontent
# fetches are untracked). The bytes stay on GitHub; nothing third-party.

on:
  push:
    branches: [main, staging]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/build_pages_site.py'
      - 'community_rapp/install.sh'
      - 'community_rapp/install.ps1'
      - '.github/workflows/installer-assets.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # daily, before the 05:20 UTC metrics snapshot: republish + verify (self-heals drift)

permissions:
  contents: write
  actions: write

concurrency:
  group: installer-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Publish installers to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="installers"
          # A staging ring publishes its own rendered installers under its own
          # tag, so the counted address can be proven there before production.
          if [ "$GITHUB_REF_NAME" != "main" ]; then tag="installers-staging"; fi
          echo "INSTALLER_TAG=$tag" >> "$GITHUB_ENV"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$(git rev-parse HEAD)" \
              --latest=false \
              --title "AIBAST Installers" \
              --notes "Rolling one-liner installers. GitHub records each asset download. Replaced on every change to the installer files on main."
          fi
          mkdir -p dist/installers
          cp install.sh                  dist/installers/install.sh
          cp install.ps1                 dist/installers/install.ps1
          cp community_rapp/install.sh   dist/installers/community_rapp-install.sh
          cp community_rapp/install.ps1  dist/installers/community_rapp-install.ps1
          if [ "$tag" != "installers" ]; then
            # The same render the staging site serves: defaults point at this ring.
            python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          from scripts.build_pages_site import INSTALLER_PATHS, render_installer
          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          branch = os.environ["GITHUB_REF_NAME"]
          for name in sorted(INSTALLER_PATHS & {"install.sh", "install.ps1"}):
              out = Path("dist/installers") / name
              text = out.read_bytes().decode("utf-8")
              out.write_bytes(render_installer(PurePosixPath(name), text, owner, repo, branch).encode("utf-8"))
          PY
          fi
          # Upload only what changed. Replacing an asset gives it a fresh
          # download counter, so an unconditional --clobber would zero the
          # counts on every run.
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          uploaded=0
          for path in dist/installers/*; do
            name="$(basename "$path")"
            if curl -fsSL --retry 3 "$base/$name" -o "$RUNNER_TEMP/current-$name" 2>/dev/null \
               && cmp -s "$RUNNER_TEMP/current-$name" "$path"; then
              echo "unchanged $name"
              continue
            fi
            gh release upload "$tag" "$path" --clobber
            echo "uploaded  $name"
            uploaded=$((uploaded + 1))
          done
          echo "Published $uploaded changed installer asset(s) to $tag"

      - name: Verify the published assets are byte-identical to main
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${INSTALLER_TAG}"
          fail=0
          # A freshly replaced asset can be served stale for a short while
          # (read-after-write on the release CDN), so give it up to two
          # minutes to converge before calling it drift.
          for name in $(ls dist/installers); do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -fsSL --retry 5 --retry-delay 3 "$base/$name" -o "$RUNNER_TEMP/$name"
              if cmp -s "$RUNNER_TEMP/$name" "dist/installers/$name"; then
                ok=1; break
              fi
              echo "retry $attempt: $name not yet identical to main; waiting 15s"
              sleep 15
            done
            if [ "$ok" = 1 ]; then
              echo "OK   $name"
            else
              echo "DRIFT $name — published asset differs from main" >&2
              fail=1
            fi
          done
          test "$fail" = 0

      - name: Refresh static metrics JSON
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "metrics.yml",
                ref: context.ref.replace("refs/heads/", "")
              });
            } catch (error) {
              // metrics.yml can be manually disabled (e.g. to pause the daily
              // snapshot) without that being a failure of THIS job — installer
              // publishing/verification above already succeeded. Only a
              // disabled-workflow 422 is tolerated; any other error (bad ref,
              // permissions, rate limit) still fails the job so a real
              // regression isn't silently swallowed.
              const disabled = error.status === 422
                && /disabled workflow/i.test(error.message || "");
              if (!disabled) throw error;
              core.warning(
                `metrics.yml is disabled — skipped the daily dispatch (${error.message}).`
              );
            }
