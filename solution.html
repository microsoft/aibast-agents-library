<script>
const OWNER = 'microsoft', REPO = 'aibast-agents-library';
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main`;
const BLOB = `https://github.com/${OWNER}/${REPO}/blob/main`;
const AGENT_DIR = '~/.brainstem/src/rapp_brainstem/agents';
const esc = s => String(s == null ? '' : s).replace(/[&<>"'`]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const num = n => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString();

async function getJSON(paths) {
  for (const p of paths) {
    try { const r = await fetch(p, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) {}
  }
  return null;
}

/* The agent returns Markdown; render the subset it actually emits so the sample
   reads the way it does in the Brainstem chat, not as escaped source. */
function md(src) {
  const lines = String(src).split('\n');
  let out = '', inTable = false, inList = false;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  const closeList = () => { if (inList) { out += '</ul>'; inList = false; } };
  const closeTable = () => { if (inTable) { out += '</tbody></table>'; inTable = false; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { closeList(); closeTable(); continue; }
    if (/^\|[\s-|:]+\|$/.test(l)) continue;                      // separator row
    if (l.startsWith('|')) {
      const cells = l.split('|').slice(1, -1).map(c => c.trim());
      if (!inTable) { closeList(); out += '<table><thead><tr>' + cells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'; inTable = true; }
      else out += '<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
      continue;
    }
    closeTable();
    if (l.startsWith('## ')) { closeList(); out += `<h2>${inline(l.slice(3))}</h2>`; continue; }
    if (l.startsWith('# '))  { closeList(); out += `<h1>${inline(l.slice(2))}</h1>`; continue; }
    if (l.startsWith('- '))  { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(l.slice(2))}</li>`; continue; }
    closeList();
    out += `<p>${inline(l)}</p>`;
  }
  closeList(); closeTable();
  return out;
}

let SAMPLE = null, activeOp = null;

async function init() {
  const id = new URLSearchParams(location.search).get('id');
  const t = '?t=' + Date.now();
  const [solDoc, reg] = await Promise.all([
    getJSON(['solutions.json' + t, RAW + '/solutions.json' + t]),
    getJSON(['registry.json' + t, RAW + '/registry.json' + t]),
  ]);
  if (!solDoc) { document.getElementById('root').innerHTML = '<div class="empty">Could not load <code>solutions.json</code>.</div>'; return; }

  const sols = solDoc.solutions.filter(s => s.is_primary !== false);
  const sol = sols.find(s => s.repo_agent === id) ||
              sols.find(s => String(s.slot) === String(id)) ||
              sols.find(s => s.sample_output) || sols[0];
  const agent = (reg?.agents || []).find(a => a.name === sol.repo_agent);

  if (sol.sample_output) SAMPLE = await getJSON([sol.sample_output + t, RAW + '/' + sol.sample_output + t]);
  render(sol, agent, sols);
}

function render(sol, agent, sols) {
  const file = agent?._file;
  if (file) document.getElementById('src-link').href = `${BLOB}/${encodeURI(file)}`;
  document.title = `${sol.advertised_display || sol.advertised_name} — AIBAST Agents Library`;

  const ops = SAMPLE?.operations || [];
  const capRows = (sol.capability_map || sol.capabilities.map(c => ({ advertised: c, operation: null })));
  const chip = (label, arr) => arr && arr.length
    ? `<span class="chip k">${label}</span>` + arr.map(x => `<span class="chip">${esc(x)}</span>`).join('') : '';

  document.getElementById('root').innerHTML = `
  <div class="crumb"><a href="index.html">Agent Library</a> › ${esc(sol.industries?.[0] || 'Solution')}</div>

  <div class="hero">
    <div class="slot">AIBAST Agents Library · advertised solution #${esc(sol.slot)}</div>
    <h1>${esc(sol.advertised_display || sol.advertised_name)}</h1>
    <p class="summary">${esc(sol.executive_summary)}</p>
    ${sol.sharepoint_list_name && sol.sharepoint_list_name !== (sol.advertised_display || sol.advertised_name)
      ? `<div class="alias">Listed on the AIBAST SharePoint as <b>${esc(sol.sharepoint_list_name)}</b>.</div>` : ''}
    <div class="chips">
      ${chip('Industries', sol.industries)}
      ${chip('Personas', sol.personas)}
      ${chip('Featured tools', sol.featured_tools)}
    </div>
    <div class="assets">
      ${sol.onepager ? '<span class="asset">✓ Published one-pager</span>' : ''}
      ${sol.demo_video ? '<span class="asset">✓ Demo video filmed</span>' : ''}
      ${agent ? '<span class="asset">✓ Agent implemented</span>' : ''}
      <a class="asset" href="request-info.html">Request the one-pager and demo video →</a>
    </div>
  </div>

  <div class="section">
    <h2>The scenario the field was shown</h2>
    <div class="sub">Straight from the published one-pager.</div>
    <div class="story">
      <div class="col situation"><h3>Situation</h3><ul>${(sol.customer_scenario || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li>—</li>'}</ul></div>
      <div class="col helped"><h3>How the agent helped</h3><ul>${(sol.capabilities || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li>—</li>'}</ul></div>
      <div class="col opportunity"><h3>Outcomes</h3><ul>${(sol.outcomes || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li>—</li>'}</ul></div>
    </div>
  </div>

  <div class="section">
    <h2>Promise to implementation</h2>
    <div class="sub">Every advertised capability, and the agent operation that delivers it.</div>
    <table>
      <thead><tr><th>Advertised capability</th><th>Agent operation</th><th>Status</th></tr></thead>
      <tbody>${capRows.map(r => `<tr>
        <td>${esc(r.advertised)}</td>
        <td class="op">${r.operation ? `<code>${esc(r.operation)}</code>` : '<span style="color:var(--text-muted)">—</span>'}</td>
        <td>${r.operation && ops.some(o => o.operation === r.operation) ? '<span class="ok">delivered</span>' : '<span style="color:var(--text-muted)">not mapped</span>'}</td>
      </tr>`).join('')}</tbody>
    </table>
  </div>

  ${ops.length ? `<div class="section">
    <h2>What it actually returns</h2>
    <div class="sub">Real output from the agent, captured ${esc(SAMPLE.captured)}. Not a mockup — this is the string the Brainstem hands back.</div>
    <div class="tabs" id="op-tabs">${ops.map((o, i) =>
      `<button class="tab${i === 0 ? ' active' : ''}" data-op="${esc(o.operation)}">${esc(o.operation)}</button>`).join('')}</div>
    <div class="output" id="op-output"></div>
  </div>` : ''}

  <div class="section">
    <h2>Run it</h2>
    <div class="sub">Drop the file into a running Brainstem; agents reload from disk on the next request.</div>
    ${file ? `<div class="cmd" onclick="copyCmd(this)">curl -fsSL ${RAW}/${encodeURI(file)} -o ${AGENT_DIR}/${esc(file.split('/').pop())}</div>` : ''}
    <p class="note" style="margin-top:12px">Then ask it, in the Brainstem chat:
      ${ops.slice(1, 3).map(o => `<br>&nbsp;&nbsp;· <i>&ldquo;Run ${esc(o.operation)} on ${esc(agent?.display_name || '')}&rdquo;</i>`).join('')}</p>
  </div>

  <div class="section">
    <h2>Provenance</h2>
    <dl class="kv">
      <dt>Advertised as</dt><dd>${esc(sol.advertised_display || sol.advertised_name)} · solution #${esc(sol.slot)}</dd>
      <dt>SharePoint listing</dt><dd>${esc(sol.sharepoint_list_name || '—')}</dd>
      <dt>Repo agent</dt><dd class="mono">${esc(sol.repo_agent)}</dd>
      <dt>Source file</dt><dd>${file ? `<a href="${BLOB}/${encodeURI(file)}" target="_blank" rel="noopener">${esc(file)}</a>` : '—'}</dd>
      <dt>Version / size</dt><dd>${esc(agent?.version || '—')} · ${num(agent?._lines)} lines</dd>
      <dt>Data plane</dt><dd>Static synthetic data shaped to the real sources — no live endpoint required.</dd>
    </dl>
  </div>

  <footer>
    Advertised catalog in <a href="solutions.json">solutions.json</a> ·
    <a href="index.html">all ${sols.length} solutions</a> ·
    <a href="https://github.com/${OWNER}/${REPO}" target="_blank" rel="noopener">${OWNER}/${REPO}</a>
  </footer>`;

  if (ops.length) {
    activeOp = ops[0].operation;
    document.querySelectorAll('#op-tabs .tab').forEach(el => el.onclick = () => {
      activeOp = el.dataset.op;
      document.querySelectorAll('#op-tabs .tab').forEach(x => x.classList.toggle('active', x.dataset.op === activeOp));
      paintOutput(ops);
    });
    paintOutput(ops);
  }
}

function paintOutput(ops) {
  const o = ops.find(x => x.operation === activeOp) || ops[0];
  document.getElementById('op-output').innerHTML =
    `<div class="label">${esc(o.label)}</div>` + md(o.output);
}

function copyCmd(el) {
  navigator.clipboard.writeText(el.textContent).then(() => {
    el.classList.add('copied'); setTimeout(() => el.classList.remove('copied'), 1400);
  }).catch(() => {});
}

init();
</script>
</body>
</html>
