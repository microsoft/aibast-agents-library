<body>
<div class="tour-top">
  <a class="home" href="index.html">&lsaquo; AI BAST Agents Library</a>
  <nav class="steps" id="steps" aria-label="Tour steps"></nav>
  <div class="clock" id="clock" aria-live="polite"><b id="clock-step">0:00</b><span id="clock-total">0:00 of 12:00</span></div>
</div>
<div class="tour">
  <section class="notes" id="notes" aria-live="polite"></section>
  <section class="stage" id="stage"></section>
</div>
<script>
// Twelve minutes, six steps, one live page each. Every page shown is this site, so the tour works anywhere the
// library is served and needs nothing installed. Timings are budgets: the step clock turns red past its budget.
const STEPS = [
  {
    id: "why", title: "Why this exists", minutes: 1.5, page: "index.html",
    say: "Customers want to see an agent working in their world before they commit. This library gets you there in days, not months.",
    points: ["66 agent solutions across 12 industries", "61 demo videos and 65 one-pagers", "Click-through demos and hands-on workshops"],
    action: "Scroll the library once. Don't explain it yet."
  },
  {
    id: "find", title: "Find the agent", minutes: 2, page: "index.html#agent/%40aibast-agents-library%2Faccount-intelligence",
    say: "Start from the customer's problem, not the technology. Here is an account team that needs a briefing before every meeting.",
    points: ["Why try it: the business case in plain words", "Customer challenge and how the work changes", "The Microsoft products behind it"],
    action: "Read the 'Why try it' box out loud. Stop there."
  },
  {
    id: "see", title: "See it answer", minutes: 2.5, page: "solutions/_shared/m365-copilot-demo.html?scenario=account-intelligence-account-overview",
    say: "This is the agent in Microsoft 365 Copilot, answering a real question on synthetic data.",
    points: ["A recorded answer, replayed exactly", "Each example question has its own recording", "Synthetic data: no customer information anywhere"],
    action: "Press Play. Let the answer finish. Say nothing while it streams."
  },
  {
    id: "build", title: "Build it", minutes: 2, page: "solutions/account-intelligence/quest.html",
    say: "Anyone can build this one, hands on, in a workshop that walks through every step.",
    points: ["Guided, step by step", "Runs on Copilot Studio", "The same agent the customer just saw"],
    action: "Scroll to the first step. Don't click through every step."
  },
  {
    id: "api", title: "Your AI can use it too", minutes: 2, page: "llms.txt",
    say: "The whole library is also a public, read-only API. Your Copilot or any AI agent can read it directly.",
    points: ["Every agent, one line each, for AI agents to read", "One data file per agent, with its recorded answers", "Static files: no sign-in, no rate limit"],
    action: "Scroll the agent list once. Say: any Copilot can read this page."
  },
  {
    id: "next", title: "Take it to your customer", minutes: 2, page: "index.html#agent/%40aibast-agents-library%2Faccount-intelligence",
    say: "Pick one agent for one customer this week. Request its one-pager and demo video, then run the workshop with them.",
    points: ["Request the one-pager and demo video from the agent's page", "Bring the click-through demo to the meeting", "Run the workshop together"],
    action: "Show the 'Request the one-pager and demo video' button. Then stop and take questions."
  }
];
const BUDGET = STEPS.reduce((sum, step) => sum + step.minutes, 0) * 60;
const $ = id => document.getElementById(id);
let current = 0;
let started = null;
let stepStarted = null;
const doneSteps = new Set();

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function clock(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderSteps() {
  $("steps").innerHTML = STEPS.map((step, i) =>
    `<button type="button" data-step="${i}" class="${doneSteps.has(i) ? "done" : ""}" ${i === current ? 'aria-current="step"' : ""}>${i + 1}. ${esc(step.title)}</button>`
  ).join("") + `<button type="button" data-step="${STEPS.length}" ${current === STEPS.length ? 'aria-current="step"' : ""}>Questions</button>`;
  $("steps").querySelectorAll("button").forEach(button => button.addEventListener("click", () => go(Number(button.dataset.step))));
}

function go(index) {
  if (index < 0 || index > STEPS.length) return;
  if (index > current) for (let i = current; i < index; i++) doneSteps.add(i);
  current = index;
  stepStarted = Date.now();
  if (!started && index > 0) started = Date.now();
  try { history.replaceState(null, "", `#${index < STEPS.length ? STEPS[index].id : "questions"}`); } catch (error) {}
  render();
}

function render() {
  renderSteps();
  if (current === STEPS.length) {
    $("notes").innerHTML = `<div class="when">After 12 minutes</div><h1>Questions</h1>
      <p class="say">Thank them, then ask one question back: which customer conversation would this help this week?</p>
      <div class="nav"><button type="button" id="back">Back</button><button type="button" class="primary" id="restart">Start over</button></div>`;
    $("stage").innerHTML = `<div class="end"><h2>Pick one agent for one customer this week.</h2>
      <p>Browse the <a href="index.html">AI BAST Agents Library</a>, request the one-pager and demo video, and run the workshop together.</p></div>`;
    $("back").addEventListener("click", () => go(current - 1));
    $("restart").addEventListener("click", () => { started = null; doneSteps.clear(); go(0); });
    return;
  }
  const step = STEPS[current];
  const startAt = STEPS.slice(0, current).reduce((sum, s) => sum + s.minutes, 0);
  $("notes").innerHTML = `<div class="when">${clock(startAt * 60)} to ${clock((startAt + step.minutes) * 60)} &middot; step ${current + 1} of ${STEPS.length}</div>
    <h1>${esc(step.title)}</h1>
    <p class="say">${esc(step.say)}</p>
    <ul>${step.points.map(point => `<li>${esc(point)}</li>`).join("")}</ul>
    <div class="do"><b>Do this</b>${esc(step.action)}</div>
    <div class="nav"><button type="button" id="back" ${current === 0 ? "disabled" : ""}>Back</button><button type="button" class="primary" id="next">${current === STEPS.length - 1 ? "Questions" : "Next"}</button></div>
    <p class="keys">Keyboard: right arrow for next, left arrow for back.</p>`;
  $("stage").innerHTML = `<iframe title="${esc(step.title)}" src="${esc(step.page)}"></iframe><a class="open" href="${esc(step.page)}" target="_blank" rel="noopener">Open in a new tab &#8599;</a>`;
  $("back").addEventListener("click", () => go(current - 1));
  $("next").addEventListener("click", () => go(current + 1));
}

function tick() {
  const step = STEPS[current];
  const inStep = stepStarted ? (Date.now() - stepStarted) / 1000 : 0;
  const total = started ? (Date.now() - started) / 1000 : 0;
  $("clock-step").textContent = clock(inStep);
  $("clock-total").textContent = `${clock(total)} of ${clock(BUDGET)}`;
  $("clock").classList.toggle("over", Boolean(step) && inStep > step.minutes * 60);
}

document.addEventListener("keydown", event => {
  if (event.target.closest && event.target.closest("input, textarea, [contenteditable]")) return;
  if (event.key === "ArrowRight") go(current + 1);
  if (event.key === "ArrowLeft") go(current - 1);
});

const fromHash = STEPS.findIndex(step => `#${step.id}` === location.hash);
go(location.hash === "#questions" ? STEPS.length : Math.max(0, fromHash));
setInterval(tick, 500);
</script>
