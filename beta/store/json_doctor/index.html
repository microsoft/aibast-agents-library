<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Doctor</title>
<style>
:root{--bg:#faf9f7;--fg:#1b1917;--dim:#6b625a;--line:#e5dfd7;--accent:#0369a1;--card:#fff;--code:#f3f0ec;--bad:#b91c1c;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#151311;--fg:#ece7e1;--dim:#9c9289;--line:#2b2724;--accent:#38bdf8;--card:#1c1917;--code:#201d1a;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 ui-sans-serif,system-ui,sans-serif}
.wrap{max-width:46rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}h1{font-size:1.9rem;margin:0 0 .35rem;letter-spacing:-.02em}
.lede{color:var(--dim);margin:0 0 2rem}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.1rem;margin-bottom:1rem}
label{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:.3rem}
input,select{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:14px ui-monospace,monospace;margin-bottom:.9rem}
button{background:var(--accent);color:#fff;border:0;padding:.6rem 1.1rem;border-radius:7px;font-weight:600;cursor:pointer}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:.9rem;overflow-x:auto;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{text-align:left;padding:.42rem .5rem;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;color:var(--dim)}code{background:var(--code);padding:.1em .35em;border-radius:4px}
.opt{color:var(--dim);font-size:.8rem}.note{color:var(--dim);font-size:.85rem}
</style></head><body><div class="wrap">
<h1>JSON Doctor</h1><p class="lede">Understand, validate and compare JSON without opening it.
Coverage is reported per field — a key present in 3% of records is a different fact from one present in 100%.</p>
<div class="card">
<label>Action</label><select id="action">
<option value="inspect">inspect — infer the shape</option>
<option value="validate">validate — find the break</option>
<option value="diff">diff — compare two files</option>
<option value="query">query — pull a dotted path</option></select>
<label>File</label><input id="path" placeholder="data.jsonl" spellcheck="false">
<label>Second file (diff) / dotted key (query)</label><input id="extra" placeholder="other.jsonl  or  users.0.name" spellcheck="false">
<button id="go">Run</button></div><div id="out"></div>
<script>
const $=s=>document.querySelector(s);
$('#go').onclick=async()=>{const b=$('#go');b.disabled=true;b.textContent='Running…';
 const a=$('#action').value,x=$('#extra').value;
 let call=`action=${a} path="${$('#path').value}"`;
 if(a==='diff'&&x)call+=` other="${x}"`; if(a==='query'&&x)call+=` key="${x}"`;
 try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({user_input:`Use the JsonDoctor tool with ${call}. Reply only DONE.`})});
  const d=await r.json();const m=String(d.agent_logs||'').match(/\{[\s\S]*\}/);
  $('#out').innerHTML=m?render(JSON.parse(m[0]),a):`<div class="card"><pre>${esc(d.response||'no result')}</pre></div>`;
 }catch(e){$('#out').innerHTML=`<div class="card">Could not reach the brainstem.<pre>${esc(e.message)}</pre></div>`;}
 finally{b.disabled=false;b.textContent='Run';}};
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(d,a){if(d.status==='error')return`<div class="card" style="color:var(--bad)">${esc(d.message)}</div>`;
 if(a==='inspect'){let h=`<div class="card"><div><strong>${d.records}</strong> record(s) · ${esc(d.root_type)} · ${d.bytes} bytes</div>
  <table><tr><th>field</th><th>types</th><th>coverage</th></tr>`;
  for(const[k,v]of Object.entries(d.fields||{}))h+=`<tr><td><code>${esc(k)}</code></td><td>${esc((v.types||[]).join(' | '))}</td>
   <td>${esc(v.coverage)} ${v.optional?'<span class="opt">optional</span>':''}</td></tr>`;
  return h+`</table><p class="note">${esc(d.note||'')}</p></div>`;}
 if(a==='validate')return`<div class="card"><strong style="color:${d.valid?'var(--ok)':'var(--bad)'}">${d.valid?'VALID':'INVALID'}</strong>
  ${d.valid?`<div>${d.records} record(s), ${esc(d.root_type)}</div>`:`<div>line ${d.line}, column ${d.column}</div><pre>${esc(d.context||d.error||'')}</pre>`}</div>`;
 return`<div class="card"><pre>${esc(JSON.stringify(d,null,2))}</pre></div>`;}
</script></div></body></html>
