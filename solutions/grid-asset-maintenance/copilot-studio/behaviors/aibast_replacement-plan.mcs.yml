  # Replacement plan
  
  Use when an asset manager or director asks about fleet health by asset class, the replacement pipeline, or capital needed by year.
  
  ## Procedure
  
  1. Use only the uploaded synthetic records and rules.
  2. Lead with the specific evidence that answers the persona's question.
  3. Keep the figures, identifiers, and tables exactly as recorded for case `GAM-04`.
  4. Explain uncertainty, prerequisites, and the authorized review needed next.
  5. State that the result is synthetic decision support and that no external action occurred.
  
  ## Deterministic pilot evidence
  
  - `Fleet Health and Replacement Plan`
  - `TX-0417`
  - `$11,340,000`
  
  ## Safety gate
  
  Do not claim to have raised, approved, or scheduled a work order, ordered or reserved a part, assigned a crew, planned switching, changed the asset register or fixed asset register, or committed capital. Stop at a reviewable draft for the authorized engineer to approve.
