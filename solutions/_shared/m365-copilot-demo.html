<script>
(() => {
  'use strict';
  const API = '../../api/v1/';
  const W = 1728, H = 922;           // the surfaces were captured at this size
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const SPEED = Math.min(50, Math.max(1, Number(params.get('speed')) || 1));   // for tests and rehearsal
  const getJSON = (path) => fetch(API + path).then((r) => { if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); });
  const sleep = (ms) => new Promise((res) => { const t = setTimeout(res, ms / SPEED); run.abort.signal.addEventListener('abort', () => { clearTimeout(t); res(); }, {once: true}); });

  let surfaces = [], surfaceId = '', solution = null, steps = [], index = 0, muted = false, playing = false;
  const run = {abort: new AbortController()};
  const pages = new URL('../../', location.href).href;

  function message(html) { $('msg').innerHTML = html; $('msg').style.display = 'flex'; $('stage').style.display = 'none'; }

  function fit() {
    const box = document.querySelector('main').getBoundingClientRect();
    const s = Math.min((box.width - 24) / W, (box.height - 24) / H);
    const st = $('stage');
    st.style.width = W + 'px'; st.style.height = H + 'px';
    st.style.transform = `translate(${-W * s / 2}px, ${-H * s / 2}px) scale(${s})`;
    fit.scale = s;
  }

  function stageRect() { return $('stage').getBoundingClientRect(); }
  function surfaceApi() { const w = $('surface').contentWindow; return w && w.AibastSurface && w.AibastSurface.ready ? w.AibastSurface : null; }

  function loadSurface(id) {
    surfaceId = id;
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.id === id)));
    const meta = surfaces.find((s) => s.id === id);
    return new Promise((resolve) => {
      const frame = $('surface');
      const done = () => { const S = surfaceApi(); if (S) { resolve(S); } else setTimeout(done, 50); };
      frame.onload = done;
      frame.src = '../../' + meta.template;
    });
  }

  async function point(name, i, click = true) {
    const S = surfaceApi(); if (!S) return;
    const r = S.target(name, i); if (!r) return;
    const st = stageRect(), s = fit.scale, main = document.querySelector('main').getBoundingClientRect();
    const x = st.left - main.left + (r.x + r.width / 2) * s, y = st.top - main.top + (r.y + r.height / 2) * s;
    const p = $('pointer'); p.style.opacity = '1'; p.style.transform = `translate(${x - 3}px, ${y - 2}px)`;
    p.dataset.target = name; p.dataset.x = x; p.dataset.y = y;
    await sleep(950);
    if (click) { const d = document.createElement('div'); d.className = 'ripple'; d.style.left = x + 'px'; d.style.top = y + 'px'; document.querySelector('main').appendChild(d); setTimeout(() => d.remove(), 700); await sleep(250); }
  }

  // Narration in the Cowork demo shape: one content-addressed clip per screen, captions timed in ms.
  // narrate() resolves when the clip ends (or, muted or without audio, after its stated duration).
  let captionsOn = true;
  window.__narration = [];
  const segFor = (block, screen) => (block && block.segments || []).find((x) => x.screenId === screen) || null;
  function caption(text) { $('caption').textContent = captionsOn ? (text || '') : ''; }
  function narrate(seg, fallback) {
    if (!seg) { caption(fallback); return Promise.resolve(); }
    const cues = (seg.captions && seg.captions.segments) || [];
    const media = seg.media, v = $('voice'), sig = run.abort.signal;
    const shown = [], t0 = performance.now();
    const show = (ms) => { const c = cues.find((x) => ms >= x.startMs && (x.endMs == null || ms < x.endMs)) || cues[cues.length - 1];
      if (c && shown[shown.length - 1] !== c.text) shown.push(c.text); caption(c ? c.text : ''); };
    show(0);
    const log = {id: seg.id, durationMs: media ? media.durationMs : null, captions: shown};
    window.__narration.push(log);
    const done = () => { log.playedMs = Math.round((performance.now() - (log.start || t0)) * SPEED); };
    const silent = () => { const tick = setInterval(() => show((performance.now() - t0) * SPEED), 100);
      return sleep(media ? media.durationMs : 1800).then(() => { clearInterval(tick); done(); }); };
    if (!media || muted || SPEED > 1) return silent();   // silent: same timing, captions only
    return clip(media).then((src) => {
      if (!src) { log.fallback = 'captions'; return silent(); }   // raw unreachable or hash mismatch
      return new Promise((res) => {
        const end = () => { v.ontimeupdate = v.onended = v.onerror = v.onplaying = null; done(); res(); };
        v.src = src; log.source = 'raw';
        v.onplaying = () => { if (!log.start) log.start = performance.now(); };
        v.ontimeupdate = () => show(v.currentTime * 1000);
        v.onended = end; v.onerror = () => sleep(media.durationMs).then(end);
        sig.addEventListener('abort', () => { v.pause(); end(); }, {once: true});
        v.play().catch(() => sleep(media.durationMs).then(end));
      });
    });
  }

  // Narration audio is not on Pages: it is fetched from the repository's raw base, which the
  // published registry pins to the exact commit. Each clip is fetched just before its step,
  // checked against its sha256, and played from memory. Any failure falls back to captions.
  let rawBase = null; const clips = {};
  const registry = () => rawBase || (rawBase = fetch('../../api/registry.json').then((r) => r.json()).then((d) => d.raw).catch(() => null));

    if (!clips[media.contentHash]) clips[media.contentHash] = (async () => {
      try {
        const base = await registry(); if (!base) return null;
        const r = await fetch(new URL(media.url, base).href); if (!r.ok) return null;
        const buf = await r.arrayBuffer();
        if (!crypto.subtle || await sha256hex(buf) !== media.contentHash) return null;
        return URL.createObjectURL(new Blob([buf], {type: media.mimeType || 'audio/wav'}));
      } catch (e) { return null; }
    })();
    return clips[media.contentHash];
  }
  function prefetch(block) { (block && block.segments || []).forEach((sg) => { if (sg.media && !muted) clip(sg.media); }); }

  // the sidebar's recent chats come from this solution's own scenario titles (persona prefix dropped)
  function chatList() { return steps.map((x) => String(x.title || '').replace(/^[^:]{1,40}:\s*/, '')).filter(Boolean).slice(0, 3); }

  // the site's cookie notice sits at the bottom of the window: keep the player's controls above it
  function keepControlsClear() {
    const fit2 = () => { const b = document.getElementById('aibast-clarity-consent');
      const h = b && b.isConnected && getComputedStyle(b).display !== 'none' && b.getClientRects().length ? b.getBoundingClientRect().height : 0;   // fixed elements have no offsetParent
      document.body.style.paddingBottom = h ? h + 'px' : ''; fit(); };

  }

  function setStepLabel() { $('step').textContent = steps.length ? `${Math.min(index + 1, steps.length)} of ${steps.length}` : ''; }

  async function playStep(i) {
    const S = surfaceApi(); if (!S) return;
    const st = steps[i]; index = i; setStepLabel();
    const sig = run.abort.signal;
    S.setAgent(st.answer.agent.name, {greeting: solution && solution.headline, title: solution && solution.name, skill: st.answer.agent.name, chats: chatList()});
    S.landing(steps.map((x) => x.question));
    prefetch(st.narration);
    const intro = narrate(segFor(st.narration, 'ask'), st.title);
    await point('composer');
    if (sig.aborted) return;
    for (let n = 1; n <= st.question.length; n += 3) { S.type(st.question.slice(0, n)); await sleep(28); if (sig.aborted) return; }
    S.type(st.question); await sleep(400);
    await intro; if (sig.aborted) return;
    S.ask(st.question); $('pointer').style.opacity = '0'; document.body.dataset.phase = 'answering';
    await sleep(1100); if (sig.aborted) return;
    await S.answer(st.answer.answer, {cps: 260 * SPEED, tick: 90 / SPEED, signal: sig});
    if (sig.aborted) return;
    const after = segFor(st.narration, 'answer');
    if (after) await narrate(after); else { caption(''); await sleep(3200); }
  }

  async function play(from = index) {
    stop(); playing = true; document.body.dataset.phase = 'playing'; $('play').textContent = 'Pause'; $('end').style.display = 'none';
    const sig = run.abort.signal;
    const last = params.get('only') === '1' ? from + 1 : steps.length;   // only=1: play one step (tests)
    for (let i = from; i < last; i++) { await playStep(i); if (sig.aborted) return; }
    playing = false; $('play').textContent = 'Play';
    showEnd();
  }
  function stop() { run.abort.abort(); run.abort = new AbortController(); playing = false; $('play').textContent = 'Play'; $('voice').pause(); }

  function showEnd() {
    document.body.dataset.phase = 'end';
    const block = solution && solution.try && solution.try.narration;
    narrate(segFor(block, 'end'), 'Like it? Get it into your own Copilot Studio with one line.');
    $('end').style.display = 'flex';
  }

  function getLine() {
    const tpl = (solution && solution.get && solution.get.prompt) || '';
    return tpl.replace('{pages}', pages);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok; }
  }

  async function start() {
    fit(); addEventListener('resize', fit); keepControlsClear();
    document.documentElement.style.setProperty('--move', (0.9 / SPEED) + 's');
    const id = params.get('scenario') || '';
    if (!id) { message('Pick an agent in the <a href="../../index.html">library</a> to preview it.'); return; }
    let first;
    try { first = await getJSON(`scenarios/${encodeURIComponent(id)}.json`); }
    catch (e) { message("This demo isn't recorded yet. Its agent is still in the <a href='../../index.html'>library</a>, ready to get."); return; }
    const [sol, idx] = await Promise.all([getJSON(`solutions/${encodeURIComponent(first.solution)}.json`), getJSON('index.json')]);
    solution = sol;
    $('name').textContent = sol.name; document.title = sol.name + ' preview';
    surfaces = await Promise.all((idx.surfaces || []).map((s) => getJSON(`surfaces/${s.id || s}.json`)));
    const recorded = (sol.try.scenarios || []).filter((s) => s.recorded);
    const docs = await Promise.all(recorded.map((s) => s.id === first.id ? first : getJSON(`scenarios/${s.id}.json`)));
    if (!docs.some((d) => d.id === first.id)) docs.unshift(first);   // a scenario linked directly but not listed in try
    steps = docs; index = Math.max(0, docs.findIndex((d) => d.id === first.id));
    const tabs = document.querySelector('.tabs');
    for (const s of surfaces) {
      const b = document.createElement('button'); b.type = 'button'; b.role = 'tab'; b.dataset.id = s.id; b.textContent = s.name;
      b.addEventListener('click', async () => { stop(); await loadSurface(s.id); history.replaceState(null, '', `?scenario=${steps[index].id}&surface=${s.id}`); ready(); });
      tabs.appendChild(b);
    }
    $('get').textContent = getLine();
    const want = params.get('surface');
    const def = (surfaces.find((s) => s.id === want) || surfaces.find((s) => s.default) || surfaces[0]).id;
    await loadSurface(def);
    ready();
    if (params.get('autoplay') === '1') play(index);
  }

  function ready() {
    const S = surfaceApi(); const st = steps[index];
    S.setAgent(st.answer.agent.name, {greeting: solution.headline, title: solution.name, skill: st.answer.agent.name, chats: chatList()});
    S.landing(steps.map((x) => x.question));
    const block = solution.try && solution.try.narration, seg = segFor(block, 'landing');
    caption(seg ? seg.captions.segments[0].text : `Preview of ${solution.name}, answering from sample records. Press Play.`);
    setStepLabel();
  }

  addEventListener('message', (e) => {
    if (e.source !== $('surface').contentWindow || !e.data) return;
    if (e.data.aibast === 'suggestion' && steps[e.data.index]) play(e.data.index);
  });
  $('play').addEventListener('click', () => playing ? stop() : play(index));
  $('next').addEventListener('click', () => { const i = Math.min(index + 1, steps.length - 1); play(i); });
  $('back').addEventListener('click', () => { const i = Math.max(index - 1, 0); play(i); });
  $('mute').addEventListener('click', () => { muted = !muted; $('voice').muted = muted; $('mute').setAttribute('aria-pressed', String(muted)); $('mute').textContent = muted ? 'Unmute' : 'Mute'; });
  $('cc').addEventListener('click', () => { captionsOn = !captionsOn; $('cc').setAttribute('aria-pressed', String(captionsOn)); if (!captionsOn) $('caption').textContent = ''; });
  $('copy').addEventListener('click', async () => { const ok = await copyText(getLine()); $('copy').textContent = ok ? 'Copied' : 'Copy failed'; setTimeout(() => { $('copy').textContent = 'Copy'; }, 1800); });
  $('replay').addEventListener('click', (e) => { e.preventDefault(); play(0); });
  start().catch((e) => message('This preview could not load. ' + String(e.message || e).replace(/</g, '&lt;')));
})();
</script>
</body>
</html>
