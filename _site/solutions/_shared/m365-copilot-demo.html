  position: fixed; inset: var(--demo-bar) 0 0 0; display: grid; place-items: center; padding: 24px; text-align: center;
  color: #424242; font: 15px/1.5 "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;

<body>
<div class="demo-bar" role="banner">
  <a id="back-link" href="../../library.html">&lsaquo; Agent library</a>
  <span class="demo-note" id="demo-note">Recorded demo &middot; synthetic data &middot; not a live customer environment</span>
  <button class="demo-play" id="play" type="button" hidden>&#9654; Play demo</button>
</div>
<div class="demo-message" id="demo-message" hidden></div>
<div id="stage"></div>
<script src="m365/m365-mirror.js"></script>
<script>
// demo-scenarios.json is generated by tools/build_demo_scenarios.py from the catalog and the recorded
// transcripts. Both files are served from this site, so a visit makes no GitHub API call. The chat is drawn
// as Microsoft 365 Copilot shows an agent (m365/m365-mirror.js) and replays the recorded answers.
const params = new URLSearchParams(location.search);
const scenarioId = params.get("scenario") || "";
const $ = id => document.getElementById(id);

async function getJSON(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error(`Could not load ${path}: ${response.status}`);
  return response.json();
}

function question(text) {
  return String(text || "").replace(/\u2019/g, "'").replace(/\s+/g, " ").trim().toLowerCase();
}

function showMessage(heading, detail) {
  $("demo-message").hidden = false;
  $("demo-message").innerHTML = "";
  const box = document.createElement("div");
  const strong = document.createElement("strong");
  strong.textContent = heading;
  box.append(strong, document.createTextNode(detail));
  $("demo-message").append(box);
}

const NOT_A_RECORDED_PROMPT = "This is a recorded demo with synthetic data, so it can only replay its example prompts. "
  + "Choose one of the suggested prompts to see the agent's recorded answer.";

async function start() {
  const index = await getJSON("demo-scenarios.json");
  const entry = index.scenarios[scenarioId];
  if (!entry) {
    showMessage("Choose a demo from the Agent library", "This link does not name a recorded demo. Go back to the library and pick an example prompt.");
    return;
  }
  const agent = index.agents[entry.agent_id];
  $("back-link").href = `../../library.html#agent/${encodeURIComponent(entry.agent_id)}`;
  const artifact = await getJSON(`../${entry.folder}/evals/transcripts.json`);
  const byCase = new Map(artifact.transcripts.map(item => [item.case_id, item]));
  const recorded = agent.scenarios
    .map(id => index.scenarios[id])
    .filter(item => item && item.recorded && byCase.has(item.case_id));
  const ordered = entry.recorded ? [entry, ...recorded.filter(item => item !== entry)] : recorded;
  const answers = new Map(recorded.map(item => {
    const transcript = byCase.get(item.case_id);
    return [question(transcript.prompt), transcript.assistant_response];
  }));
  document.title = `${entry.title} — ${agent.name}`;
  $("demo-note").textContent = `Recorded demo · synthetic data · Exact Brainstem transcript · captured ${String(artifact.captured_at || "").slice(0, 10)}`;
  const chat = window.RappM365.mount($("stage"), {
    name: agent.name,
    createdBy: "Microsoft AI BAST",
    initials: "",
    starters: ordered.slice(0, 3).map(item => ({ title: item.title, text: byCase.get(item.case_id).prompt })),
    ask: async (text) => {
      await new Promise(resolve => setTimeout(resolve, 1400));
      return answers.get(question(text)) || NOT_A_RECORDED_PROMPT;
    }
  });
  window.__demo = chat;
  if (entry.recorded) {
    const prompt = byCase.get(entry.case_id).prompt;
    $("play").hidden = false;
    $("play").textContent = `▶ Play: ${entry.title}`;
    $("play").addEventListener("click", () => { $("play").hidden = true; chat.send(prompt); });
  } else {
    $("demo-note").textContent = `This demo isn't recorded yet: "${entry.title}". Choose one of this agent's recorded prompts below.`;
  }
}

start().catch(error => {
  showMessage("Demo unavailable", error.message);
  console.error(error);
});
</script>
